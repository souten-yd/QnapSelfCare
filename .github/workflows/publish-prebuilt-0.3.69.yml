name: Publish prebuilt v0.3.69
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prebuilt-0.3.69.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt packages
        working-directory: release-artifacts/v0.3.69
        run: sha256sum --check SHA256SUMS
      - name: Publish locally built release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.69 >/dev/null 2>&1; then
            echo 'Release v0.3.69 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v0.3.69 release-artifacts/v0.3.69/*.qpkg release-artifacts/v0.3.69/SHA256SUMS \
            --target acb49333e4aecdda36e2b377330352ce2748c1cb \
            --title 'QnapSelfCare 0.3.69' \
            --notes 'Accept the Awake, In Bed and Asleep sleep labels from iPhone Shortcuts so a night that contains Awake is no longer rejected. QPKGs built locally with QDK 2.5.3. This workflow only verifies checksums and uploads prebuilt files; it does not run tests or builds.'
