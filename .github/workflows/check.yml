name: check
on:
  pull_request:
    paths:
      - '*.py'
      - 'bluetooth/**'
      - 'licenses/**'
      - 'requirements-ble.txt'
      - 'package*.json'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'bluetooth/**'
      - 'licenses/**'
      - 'requirements-ble.txt'
      - 'package*.json'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile storage.py collectors.py ble_protocol.py ble_worker.py ble_bridge.py updater.py self_update.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check web/app.js && node --check web/update.js
      - run: python -m py_compile webapp.py
      - run: sh -n qpkg/shared/selfcare.sh scripts/install-ble.sh bluetooth/entrypoint.sh
      - run: sh -n qpkg/shared/selfcare-update qpkg/shared/python3-path
      - name: Install pinned QDK
        run: |
          curl --fail --location --retry 3 --output /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          echo '17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022  /tmp/qdk.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
      - run: bash scripts/build-qpkg.sh x86_64 "$PWD/dist"
      - run: bash scripts/build-qpkg.sh arm_64 "$PWD/dist"
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo 'Release v0.3.1 already exists; leaving it unchanged.'
            exit 0
          fi
          sha256sum dist/*.qpkg > dist/SHA256SUMS
          gh release create v0.3.1 dist/*.qpkg dist/SHA256SUMS \
            --title 'QnapSelfCare 0.3.1' \
            --notes 'Adds the Web Update button: NAS-side verified QPKG download, private database/config backup, installation and restart/version checks. Detached worker survives Web restarts without nohup, records progress/logs, rejects duplicate updates and refuses arbitrary URLs/commands. Existing health records, Bluetooth setup and ports are retained. From 0.3.0, install this version once via App Center; future updates use the button. QNAP hardware self-update still requires real-device validation.' \
            --target "$GITHUB_SHA"
