name: check
on:
  pull_request:
    paths:
      - 'updater.py'
      - 'tests/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile updater.py
