name: check
on:
  pull_request:
    paths:
      - '*.py'
      - 'bluetooth/**'
      - 'licenses/**'
      - 'requirements-ble.txt'
      - 'package*.json'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'bluetooth/**'
      - 'licenses/**'
      - 'requirements-ble.txt'
      - 'package*.json'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile storage.py collectors.py ble_protocol.py ble_worker.py ble_bridge.py updater.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check web/app.js
      - run: python -m py_compile webapp.py
      - run: sh -n qpkg/shared/selfcare.sh scripts/install-ble.sh bluetooth/entrypoint.sh
      - run: sh -n qpkg/shared/selfcare-update qpkg/shared/python3-path
      - name: Install pinned QDK
        run: |
          curl --fail --location --retry 3 --output /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          echo '17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022  /tmp/qdk.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
      - run: bash scripts/build-qpkg.sh x86_64 "$PWD/dist"
      - run: bash scripts/build-qpkg.sh arm_64 "$PWD/dist"
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; leaving it unchanged.'
            exit 0
          fi
          sha256sum dist/*.qpkg > dist/SHA256SUMS
          gh release create v0.3.0 dist/*.qpkg dist/SHA256SUMS \
            --title 'QnapSelfCare 0.3.0 preview' \
            --notes 'Local health records: users/devices, manual entry/edit, SQLite persistence, history charts, CSV import/export and JSON backup/restore. USB Omron HEM-6232T / HBF-228T scan/pair/history sync with bounded jobs and automatic discovery. Shared-radio support for QnapHomeHub 0.3.0; separate Web ports 17863 and 8787. No ESP32. Bluetooth transport and QNAP hardware behavior still require real-device validation.' \
            --target "$GITHUB_SHA"
