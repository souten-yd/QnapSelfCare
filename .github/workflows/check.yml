name: check
on:
  pull_request:
    paths:
      - 'updater.py'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
  push:
    branches: [main]
    paths:
      - 'updater.py'
      - 'tests/**'
      - 'qpkg/**'
      - 'scripts/**'
      - 'web/**'
      - 'webapp.py'
      - '.github/workflows/check.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile updater.py
      - run: python -m py_compile webapp.py
      - run: sh -n qpkg/shared/selfcare.sh
      - name: Install pinned QDK
        run: |
          curl --fail --location --retry 3 --output /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          echo '17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022  /tmp/qdk.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
      - run: bash scripts/build-qpkg.sh x86_64 "$PWD/dist"
      - run: bash scripts/build-qpkg.sh arm_64 "$PWD/dist"
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo 'Release v0.2.3 already exists; leaving it unchanged.'
            exit 0
          fi
          sha256sum dist/*.qpkg > dist/SHA256SUMS
          gh release create v0.2.3 dist/*.qpkg dist/SHA256SUMS \
            --title 'QnapSelfCare 0.2.3 preview' \
            --notes 'Preview QPKG: read-only web dashboard without login, App Center icon and release update checker. Requires Python 3 on the NAS. The dashboard listens on the NAS LAN, loopback and assigned tailscale0 IPv4, and accepts connections routed over the LAN or Tailscale; do not forward port 17863 to the Internet. Measurement collection for HEM-6232T and HBF-228T is not implemented. NAS hardware installation has not been tested.' \
            --target "$GITHUB_SHA"
