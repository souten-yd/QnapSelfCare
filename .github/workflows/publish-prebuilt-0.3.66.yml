name: Publish prebuilt v0.3.66
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prebuilt-0.3.66.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt packages
        working-directory: release-artifacts/v0.3.66
        run: sha256sum --check SHA256SUMS
      - name: Publish locally built release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.66 >/dev/null 2>&1; then
            echo 'Release v0.3.66 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v0.3.66 release-artifacts/v0.3.66/*.qpkg release-artifacts/v0.3.66/SHA256SUMS \
            --target dc7c57eb5956b6f976aa75ffbea639791439bedc \
            --title 'QnapSelfCare 0.3.66' \
            --notes 'Import aligned iPhone Shortcuts start/end/value lists on the server. Reject mismatched lengths and missing entries; preserve atomic validation and deduplication. QPKGs built locally with QDK 2.5.3. This workflow only verifies checksums and uploads prebuilt files; it does not run tests or builds.'
